<!doctype html>
<html
	lang="en"
	data-theme="paper-ink">
	<head>
		<meta charset="utf-8" />
		<script>
			// Runs before first paint: restores the saved theme and skips the boot splash for a tab
			// that has already seen it. Theme ids must match THEMES in src/lib/desktop/themes.ts.
			try {
				var root = document.documentElement;
				var themes = [
					'blueprint',
					'colour',
					'ink',
					'paper-blue',
					'paper-coral',
					'paper-ink',
					'paper',
					'phosphor',
					'stone',
				];
				var theme = localStorage.getItem('theme');
				if (theme && themes.indexOf(theme) !== -1) root.dataset.theme = theme;
			} catch (error) {
				// Storage can be blocked; the default theme stays.
			}
			try {
				if (sessionStorage.getItem('booted') === '1') {
					document.documentElement.classList.add('booted');
				}
			} catch (error) {
				// Storage can be blocked; the splash plays.
			}
		</script>
		<link
			rel="alternate"
			type="application/atom+xml"
			href="/rss.xml" />
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com" />
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/apple-touch-icon.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicon-32x32.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/favicon-16x16.png" />
		<link
			rel="manifest"
			href="%sveltekit.assets%/site.webmanifest" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600;700;900&family=JetBrains+Mono:wght@500;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap"
			rel="stylesheet" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<meta
			name="theme-color"
			content="#f3ecd8" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
