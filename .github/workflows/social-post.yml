name: Publish new blog posts

on:
  push:
    paths:
      - 'src/lib/blog/**/*.svx'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview is safe. Live sends a targeted recovery post.
        required: true
        default: preview
        type: choice
        options:
          - preview
          - live
      slug:
        description: Existing lowercase blog slug for a manual preview or recovery.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: social-post-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      MASTODON_MAX_CHARACTERS: ${{ vars.MASTODON_MAX_CHARACTERS }}
    steps:
      - name: Check out the trusted default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Publish newly added posts
        if: github.event_name == 'push'
        env:
          SOCIAL_BEFORE: ${{ github.event.before }}
          SOCIAL_AFTER: ${{ github.sha }}
          SOCIAL_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$SOCIAL_RUN_ATTEMPT" != "1" ]; then
            echo "Automatic publishing is not replay-safe. Inspect provider outcomes and use targeted workflow recovery."
            exit 1
          fi
          node scripts/social-post.js --before "$SOCIAL_BEFORE" --after "$SOCIAL_AFTER" --provider mastodon --publish --wait-for-readiness
      - name: Preview or recover one existing post
        if: github.event_name == 'workflow_dispatch'
        env:
          SOCIAL_MODE: ${{ inputs.mode }}
          SOCIAL_SLUG: ${{ inputs.slug }}
        run: |
          if [ "$SOCIAL_MODE" = "live" ]; then
            node scripts/social-post.js --slug "$SOCIAL_SLUG" --provider mastodon --publish --wait-for-readiness
          else
            node scripts/social-post.js --slug "$SOCIAL_SLUG" --provider mastodon --dry-run
          fi
